[package]
name = "merlin-as"
description = "Merlin assembler: Excalibur assembly to ELF32 relocatable objects"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "merlin_as"

[dependencies]
excalibur = { path = "../excalibur" }

[dev-dependencies]
# encode_hello compares our disassembly with llvm-objdump's text.
merlin-objdump = { path = "../merlin-objdump" }
