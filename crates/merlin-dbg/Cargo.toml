[package]
name = "merlin-dbg"
description = "merlin-dbg, the Camelot debugger: a GDB remote protocol client for programs running in Grail"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
excalibur = { path = "../excalibur" }
elf = { path = "../elf" }
# The packet framing it shares with Grail's stub, and `merlin-dbg -- grail-args`,
# which runs a machine under the stub in this process.
grail = { path = "../grail" }
# `--vm NAME`: a VM's stub on an Avalon server, through the debugging messages.
avalon-client = { path = "../avalon-client" }
avalon-proto = { path = "../avalon-proto" }

[dev-dependencies]
# tests/session.rs builds a user program with its line tables, as `cargo xtask
# kernel` does, to step through it, and an RV64 program (tests/rv64) with
# merlin -g, merlin-as and merlin-ld; src/frames.rs's tests build the same
# program at both widths to read merlin's real prologues.
xtask = { path = "../xtask" }
merlin = { path = "../merlin" }
merlin-as = { path = "../merlin-as" }
merlin-ld = { path = "../merlin-ld" }
# tests/avalon.rs debugs a VM on an Avalon server in process, with Herald attached.
avalon = { path = "../avalon" }
herald = { path = "../herald" }
# (tests/processes.rs builds the root image with xtask, as `cargo xtask fs` does.)
