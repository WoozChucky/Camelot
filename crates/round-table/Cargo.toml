[package]
name = "round-table"
description = "Round Table, the control CLI of the Avalon platform: creates, lists and controls VMs on Avalon, and manages disk images on Lake"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
avalon-client = { path = "../avalon-client" }
avalon-proto = { path = "../avalon-proto" }

[dev-dependencies]
# The integration tests run an Avalon server in process and drive it through Round Table.
avalon = { path = "../avalon" }
