[package]
name = "merlin-ld"
description = "Merlin linker: ELF32 RISC-V relocatable objects to an Excalibur executable"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "merlin_ld"

[dependencies]
elf = { path = "../elf" }

[dev-dependencies]
excalibur = { path = "../excalibur" }
grail = { path = "../grail" }
merlin-as = { path = "../merlin-as" }
merlin-objdump = { path = "../merlin-objdump" }
