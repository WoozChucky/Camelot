[package]
name = "merlin-ld"
description = "Merlin linker: ELF64 RISC-V relocatable objects to an Excalibur executable"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "merlin_ld"

[dependencies]
elf = { path = "../elf" }
# Response files, read as every tool of the toolchain reads them.
excalibur = { path = "../excalibur" }

[dev-dependencies]
grail = { path = "../grail" }
merlin-as = { path = "../merlin-as" }
# The examples are .S files: merlin preprocesses them for each width.
merlin = { path = "../merlin" }
merlin-objdump = { path = "../merlin-objdump" }
