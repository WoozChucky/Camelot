name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Linux only: Windows runners cost twice as much. Windows is covered by the
  # local checks in CLAUDE.md, which must pass on Windows before every push.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The important, quick tests (crates/xtask/src/ci.rs lists them), so that
      # a run takes minutes. The whole suite, the filesystem's and the kernel's
      # long integration tests among it, is `cargo test --release`, run locally
      # on Windows before a pull request (CLAUDE.md, "Before pushing").
      - name: Test
        run: cargo xtask ci
